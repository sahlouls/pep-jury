[project]
name = "cve-exploit"
version = "0.1.0"
description = "Service de prédiction d'exploitabilité des CVE (probabilité continue façon EPSS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # --- ML / modélisation ---
    "scikit-learn>=1.4",   # pipelines, modèles, métriques, calibration
    # --- données / ETL ---
    "polars>=1.0",         # parsing des 352k JSON + agrégations (rapide)
    "pandas>=2.0",         # au bord du ML (sklearn/seaborn/SHAP)
    "numpy>=1.26",         # calcul numérique (descente de gradient from scratch)
    "pyarrow>=15",         # lecture/écriture Parquet
    # --- visualisation ---
    "matplotlib>=3.8",     # graphes de base
    "seaborn>=0.13",       # graphes statistiques
    # --- explicabilité : SHAP ajouté au P6 (tire numba/llvmlite, à résoudre pour py3.12) ---
    # --- persistance ---
    "joblib>=1.3",         # sérialisation du model.joblib
    "tqdm>=4.66",          # barres de progression (parcours 352k fichiers)
    # --- service ---
    "fastapi>=0.110",      # API REST /score/CVE-xxxx
    "uvicorn[standard]>=0.29",  # serveur ASGI
    # --- notebooks ---
    "jupyter>=1.0",
    "ipykernel>=6.29",     # noyau pour exécuter les notebooks dans le venv uv
    "shap>=0.49.1",
    "numba>=0.60",
    "llvmlite>=0.43",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "cvss>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cve_exploit"]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

# Lint Python (back cve_exploit). Regles par defaut (pyflakes + erreurs pycodestyle) = filet
# de securite non intrusif, sans reformater le style ASCII/commentaires FR existant.
[tool.ruff]
line-length = 100
target-version = "py312"
