# docker-compose -- infra locale du service PEP (db + api + front).
# Tout lancer :   docker compose up --build       (front sur http://localhost:5173, api sur :8000)
# DB seule (dev) : docker compose up -d db
# NB : model.joblib et le bundle sont MONTES en volume (pas dans l'image) -> il faut avoir
# entraine le modele au moins une fois (models/model.joblib present) avant `up`.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cve
      POSTGRES_PASSWORD: cve
      POSTGRES_DB: cve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cve -d cve"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://cve:cve@db:5432/cve
      CVE_DATA_DIR: /data/cve_threat_intel
    volumes:
      - ./models:/app/models:ro                     # model.joblib + model_meta.json
      - ./cve_threat_intel:/data/cve_threat_intel:ro # optionnel : pour GET /score/{id}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  front:
    build:
      context: ./frontend
      # VITE_API_URL est fige au build et appele par le NAVIGATEUR -> URL cote hote.
      args:
        VITE_API_URL: "http://localhost:8000"
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
